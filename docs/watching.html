<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
  
<style>
.demo-banner {
  background: #fff7d6;
  color: #5b4a00;
  border-bottom: 1px solid #e8d27a;
  padding: 6px 14px;
  font: 13px/1.5 -apple-system, system-ui, sans-serif;
  text-align: center;
}
button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
</style>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage · A/V</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg?v=1780209848">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css?v=1780209848">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<div class="demo-banner" role="note">Static demo &middot; interactions simulated &middot; bug data from public Bugzilla A/V bugs</div>


<header class="topbar">
  <div class="brand">
    <h1 class="brand-title">Triage</h1>
    <span class="brand-sub"><strong>Audio/Video</strong> · Sunday, May 31</span>
  </div>
  <div class="topbar-right">
    <div class="stats">
      <span class="stat stat--primary"><span class="num">13</span><span class="lbl">pending</span></span>
    </div>
    <details id="process-queue-dropdown" class="process-queue-dropdown">
      <summary id="btn-process-queue" class="btn-process-queue"
               aria-haspopup="true">
        Process queue · <span class="queue-count">0</span>
        <span class="dropdown-caret" aria-hidden="true">▾</span>
      </summary>
      <div class="queue-dropdown-panel" id="queue-dropdown-panel">
        
<div class="queue-dropdown-content" id="queue-dropdown-content"><p class="queue-dropdown-empty">Nothing queued.</p></div>
      </div>
    </details>
  </div>
</header>

<div class="layout">
  <main>
    <nav class="tabs" role="tablist">
      
        
        <a class="tab  "
           href="triaged.html"
           role="tab"
           aria-selected="false"
           data-nav-target="triaged.html"
           data-nav-swap="#tab-content">
          <span class="label">Analyzed</span>
          <span class="count">2</span>
        </a>
      
        
        <a class="tab  "
           href="needs-info.html"
           role="tab"
           aria-selected="false"
           data-nav-target="needs-info.html"
           data-nav-swap="#tab-content">
          <span class="label">Needs Info</span>
          <span class="count">9</span>
        </a>
      
        
        <a class="tab  "
           href="close.html"
           role="tab"
           aria-selected="false"
           data-nav-target="close.html"
           data-nav-swap="#tab-content">
          <span class="label">Close / Reassign</span>
          <span class="count">2</span>
        </a>
      
        
        <a class="tab tab--active tab--empty"
           href="watching.html"
           role="tab"
           aria-selected="true"
           data-nav-target="watching.html"
           data-nav-swap="#tab-content">
          <span class="label">Awaiting reply</span>
          <span class="count">0</span>
        </a>
      
    </nav>

    <div id="tab-content">
      

  

  <p class="empty">No bugs being watched. Use <code>watch-add</code> to track replies on a needinfo.</p>


    </div>
  </main>
</div>


<script>
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function autosizeAll() {
    document.querySelectorAll('.composer-input').forEach(autosize);
  }
  document.addEventListener('input', (e) => {
    if (e.target.classList.contains('composer-input')) {
      autosize(e.target);
      const send = e.target.closest('.composer-frame')?.querySelector('.composer-send');
      if (send) send.disabled = !e.target.value.trim();
    }
    if (e.target.classList.contains('rail-search')) {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.rail-item').forEach(el => {
        const bugId = (el.dataset.bugId || '').toLowerCase();
        const title = (el.querySelector('.rail-title')?.textContent || '').toLowerCase();
        const match = !q || bugId.includes(q) || title.includes(q);
        el.parentElement.style.display = match ? '' : 'none';
      });
    }
  });
  // Keyboard shortcuts for power users.
  // Ignored when any input/textarea is focused so typing isn't hijacked.
  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['input', 'textarea', 'select'].includes(tag) && e.key !== 'Escape') return;
    const clickIfActive = sel => {
      const btn = document.querySelector(sel);
      if (btn && !btn.disabled) { btn.click(); e.preventDefault(); }
    };
    switch (e.key) {
      case 'ArrowDown':
      case 'j':
        clickIfActive('.deck-next');
        break;
      case 'ArrowUp':
      case 'k':
        clickIfActive('.deck-prev');
        break;
      case 'ArrowLeft':
      case 'ArrowRight': {
        // Switch to prev/next topbar tab. No wrap at edges.
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const idx = tabs.findIndex(t => t.classList.contains('tab--active'));
        if (idx < 0) break;
        const target = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
        if (target >= 0 && target < tabs.length) {
          tabs[target].click();
          e.preventDefault();
        }
        break;
      }
      case '/':
        {
          const search = document.querySelector('.rail-search');
          if (search) { search.focus(); search.select(); e.preventDefault(); }
        }
        break;
      case 'a':
        clickIfActive('.deck-stage .btn-primary, .deck-stage .btn-reassign');
        break;
      case 'Escape':
        if (document.activeElement && 'blur' in document.activeElement) {
          document.activeElement.blur();
        }
        break;
    }
  });
  // Move active state instantly on tab click so the UI feels responsive
  // even before the htmx response arrives.
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('tab--active');
      t.setAttribute('aria-selected', 'false');
    });
    tab.classList.add('tab--active');
    tab.setAttribute('aria-selected', 'true');
  });
  autosizeAll();
  document.addEventListener('htmx:afterSettle', autosizeAll);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(autosizeAll);
  }

  // After an htmx swap (tab click, rail click, queue-dropdown row click),
  // only #tab-content / #deck-area changes — the topbar tabs aren't
  // re-rendered. Sync the active tab indicator and the rail highlight
  // from the URL so the chrome reflects where we just landed.
  document.addEventListener('htmx:afterSwap', () => {
    const params = new URLSearchParams(window.location.search);
    const activeTab = params.get('tab');
    if (activeTab) {
      document.querySelectorAll('.tab').forEach(t => {
        const slug = new URL(t.href, window.location.origin).searchParams.get('tab');
        const isActive = slug === activeTab;
        t.classList.toggle('tab--active', isActive);
        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }
    const activeBug = params.get('bug');
    if (!activeBug) return;
    document.querySelectorAll('.rail-item').forEach(el => {
      el.classList.toggle('is-active', el.dataset.bugId === activeBug);
    });
  });

  // Snappy tab indicator update when clicking a queue-dropdown row,
  // before the htmx response arrives. (The afterSwap handler above is
  // the source of truth; this just removes the perceived lag.)
  document.addEventListener('click', (e) => {
    const jump = e.target.closest('.queue-dropdown-jump');
    if (!jump || !jump.dataset.targetTab) return;
    const slug = jump.dataset.targetTab;
    document.querySelectorAll('.tab').forEach(t => {
      const tSlug = new URL(t.href, window.location.origin).searchParams.get('tab');
      const isActive = tSlug === slug;
      t.classList.toggle('tab--active', isActive);
      t.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  });

  // SSE: re-fetch the current tab content when the dashboard's data
  // directory changes (e.g. terminal /triage writes a new pending JSON,
  // a Claude session drains the queue, or anything else touches the files).
  (function () {
    if (typeof EventSource === 'undefined' || typeof htmx === 'undefined') return;
    /* SSE disabled in static demo */ return;
    const refresh = () => {
      const url = window.location.pathname + window.location.search;
      htmx.ajax('GET', url, { target: '#tab-content', swap: 'innerHTML' });
    };
    ['draft-changed', 'draft-deleted', 'watch-changed',
     'investigation-changed'].forEach((evt) => {
      es.addEventListener(evt, refresh);
    });
    // queue-changed: just update the topbar button's count, no full refresh.
    es.addEventListener('queue-changed', async () => {
      try {
        // Refresh the topbar count span.
        const r = await fetch('/queue/count');
        const { count } = await r.json();
        const span = document.querySelector('#btn-process-queue .queue-count');
        if (span) span.textContent = count;
        // Refresh the dropdown contents so the open dropdown stays in
        // sync with the JSONL (e.g. external append/remove or a drain
        // truncating the file).
        const panel = document.getElementById('queue-dropdown-panel');
        if (panel) {
          htmx.ajax('GET', '/queue/dropdown', {
            target: '#queue-dropdown-panel', swap: 'innerHTML',
          });
        }
      } catch (_) { /* ignore */ }
    });
  })();

  // Explicit copy from the Process queue dropdown.
  async function copyDrainPrompt(btn) {
    if (!btn || btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Copying…';
    try {
      const r = await fetch('/queue/prepare', { method: 'POST' });
      const data = await r.json();
      if (!r.ok || !data.prompt) {
        btn.textContent = 'Nothing to drain';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
        return;
      }
      await navigator.clipboard.writeText(data.prompt);
      btn.textContent = 'Copied · paste into Claude';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    } catch (e) {
      btn.textContent = 'Failed';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
    }
  }

  // Close the Process queue dropdown when clicking outside it.
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('process-queue-dropdown');
    if (!dropdown || !dropdown.open) return;
    if (!dropdown.contains(e.target)) {
      dropdown.open = false;
    }
  });
</script>

<script>
// Static-demo shims: localStorage-backed feedback + fetch+swap navigation.
// Together they preserve the htmx feel (no full-page repaint when switching
// tabs / focused cards) while running entirely client-side.
(function () {
  const KEY = (bugId) => 'triage-demo:feedback:' + bugId;

  function read(bugId) {
    try { return JSON.parse(localStorage.getItem(KEY(bugId)) || '[]'); }
    catch (_) { return []; }
  }
  function write(bugId, list) {
    localStorage.setItem(KEY(bugId), JSON.stringify(list));
  }

  function fmtTs(ts) {
    // Match server format: '2026-05-31T07:21:42Z' → '2026-05-31 07:21'
    return (ts || '').slice(0, 16).replace('T', ' ');
  }

  function ensureHost(bugId) {
    let host = document.querySelector('[data-feedback-list="' + bugId + '"]');
    if (host) return host;
    // No server-rendered list — create one ourselves, inserted right after
    // the feedback-status host (matches the server's section position).
    const form = document.querySelector('form[data-feedback-form="' + bugId + '"]');
    if (!form) return null;
    const section = document.createElement('section');
    section.className = 'pending-feedback';
    section.setAttribute('aria-label', 'Queued feedback for this bug');
    section.innerHTML =
      '<p class="pending-feedback-label">Pending feedback (0)</p>' +
      '<ul class="pending-feedback-list" data-feedback-list="' + bugId + '"></ul>';
    // Insert AFTER the form's parent composer wrapper, matching server.
    const fbStatus = document.getElementById('fbstatus-' + bugId);
    const anchor = fbStatus || form;
    anchor.parentNode.insertBefore(section, anchor.nextSibling);
    return section.querySelector('[data-feedback-list]');
  }

  function render(bugId) {
    const list = read(bugId);
    const host = ensureHost(bugId);
    if (!host) return;
    const section = host.closest('.pending-feedback');
    if (!list.length) {
      if (section) section.style.display = 'none';
      host.innerHTML = '';
      return;
    }
    if (section) {
      section.style.display = '';
      const label = section.querySelector('.pending-feedback-label');
      if (label) label.textContent = 'Pending feedback (' + list.length + ')';
    }
    host.innerHTML = list.map((fb, i) =>
      '<li class="pending-feedback-item">' +
        '<span class="pf-ts">' + fmtTs(fb.ts) + '</span>' +
        '<span class="pf-text"></span>' +
        '<button type="button" class="pf-remove" ' +
          'aria-label="Remove this queued feedback" title="Remove" ' +
          'data-feedback-remove="' + bugId + '" data-index="' + i + '">' +
          '\u2715' +
        '</button>' +
      '</li>'
    ).join('');
    const items = host.querySelectorAll('.pf-text');
    list.forEach((fb, i) => items[i].textContent = fb.text);
  }

  // ─── queue badge + dropdown render ────────────────────────────────
  function allFeedback() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('triage-demo:feedback:')) continue;
      const bugId = k.slice('triage-demo:feedback:'.length);
      try {
        const list = JSON.parse(localStorage.getItem(k) || '[]');
        list.forEach(fb => out.push({ bugId, ts: fb.ts, text: fb.text, tab: fb.tab || 'triaged' }));
      } catch (_) {}
    }
    out.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
    return out;
  }

  function renderQueue() {
    const items = allFeedback();
    const count = items.length;
    document.querySelectorAll('#btn-process-queue .queue-count').forEach(span => {
      span.textContent = count;
    });
    const panel = document.getElementById('queue-dropdown-content');
    if (!panel) return;
    if (!count) {
      panel.innerHTML = '<p class="queue-dropdown-empty">Nothing queued.</p>';
      return;
    }
    const rows = items.map(it => {
      const tsShort = (it.ts || '').slice(11, 16);
      const href = it.tab + '-bug-' + it.bugId + '.html';
      const escText = it.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return (
        '<li class="queue-dropdown-row queue-dropdown-row--refine">' +
          '<a class="queue-dropdown-jump" href="' + href + '" data-target-tab="' + it.tab + '">' +
            '<span class="queue-badge queue-badge--refine">refine</span>' +
            '<span class="queue-dropdown-bug">' + it.bugId + '</span>' +
            '<span class="queue-dropdown-detail">' + escText + '</span>' +
            '<span class="queue-dropdown-ts">' + tsShort + '</span>' +
          '</a>' +
          '<button type="button" class="queue-dropdown-remove" ' +
            'aria-label="Remove" title="Remove" ' +
            'data-queue-remove-bug="' + it.bugId + '" data-queue-remove-ts="' + (it.ts || '') + '">' +
            '\u2715' +
          '</button>' +
        '</li>'
      );
    }).join('');
    const word = count === 1 ? 'action' : 'actions';
    panel.innerHTML =
      '<p class="queue-dropdown-summary">' + count + ' queued ' + word + '</p>' +
      '<ul class="queue-dropdown-list">' + rows + '</ul>';
  }

  // Queue ✕ removes the matching feedback entry.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-queue-remove-bug]');
    if (!btn) return;
    e.preventDefault();
    const bugId = btn.getAttribute('data-queue-remove-bug');
    const ts = btn.getAttribute('data-queue-remove-ts');
    const list = read(bugId).filter(fb => fb.ts !== ts);
    write(bugId, list);
    render(bugId);
    renderQueue();
  });

  function currentTab() {
    const name = (window.location.pathname.split('/').pop() || 'index.html');
    const m = name.match(/^([a-z\-]+)(?:-bug-\d+)?\.html$/);
    if (!m) return 'triaged';
    return m[1] === 'index' ? 'triaged' : m[1];
  }

  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-feedback-form]');
    if (!form) return;
    e.preventDefault();
    const bugId = form.getAttribute('data-feedback-form');
    const ta = form.querySelector('textarea');
    const text = (ta && ta.value || '').trim();
    if (!text) return;
    const list = read(bugId);
    list.push({ text, ts: new Date().toISOString(), tab: currentTab() });
    write(bugId, list);
    if (ta) ta.value = '';
    render(bugId);
    renderQueue();
  });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-feedback-remove]');
    if (!btn) return;
    e.preventDefault();
    const bugId = btn.getAttribute('data-feedback-remove');
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    const list = read(bugId);
    list.splice(idx, 1);
    write(bugId, list);
    render(bugId);
    renderQueue();
  });

  function initFeedback() {
    document.querySelectorAll('form[data-feedback-form]').forEach((form) => {
      render(form.getAttribute('data-feedback-form'));
    });
    renderQueue();
  }
  initFeedback();

  // ─── fetch+swap navigation shim ───────────────────────────────────
  // Intercept clicks on .tab / .rail-item / .queue-dropdown-jump / .deck-prev
  // / .deck-next and swap only #tab-content, mirroring what the live htmx
  // app does. Hotkeys (arrow keys, j/k, /, a) keep working because their
  // handler just calls .click() on these same elements.
  const NAV_PATTERN = /^[a-z\-]+(?:-bug-\d+)?\.html$/;

  function parseFilename(name) {
    const m = (name || '').match(/^([a-z\-]+)(?:-bug-(\d+))?\.html$/);
    if (!m) return null;
    const tab = m[1] === 'index' ? 'triaged' : m[1];
    return { tab, bug: m[2] || null };
  }

  function syncActiveStates(parsed) {
    document.querySelectorAll('.tab').forEach((t) => {
      const p = parseFilename(t.getAttribute('href') || '');
      const isActive = !!(p && p.tab === parsed.tab);
      t.classList.toggle('tab--active', isActive);
      t.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    if (parsed.bug) {
      document.querySelectorAll('.rail-item').forEach((el) => {
        el.classList.toggle('is-active', el.dataset.bugId === parsed.bug);
      });
    }
  }

  async function navigate(href, push, swapSel) {
    const parsed = parseFilename(href);
    if (!parsed) return false;
    const sel = swapSel || '#tab-content';
    try {
      const resp = await fetch(href);
      if (!resp.ok) return false;
      const html = await resp.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const newNode = doc.querySelector(sel);
      const curNode = document.querySelector(sel);
      if (!newNode || !curNode) return false;
      curNode.innerHTML = newNode.innerHTML;

      if (push !== false) history.pushState({}, '', href);
      syncActiveStates(parsed);
      initFeedback();
      // Let any existing afterSwap/afterSettle handlers in base.html run
      // (autosizeAll, etc).
      document.dispatchEvent(new CustomEvent('htmx:afterSwap'));
      document.dispatchEvent(new CustomEvent('htmx:afterSettle'));
      return true;
    } catch (_) {
      return false;
    }
  }

  document.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || (e.button && e.button !== 0)) return;
    const el = e.target.closest('a[href], [data-nav-target]');
    if (!el) return;
    const target = el.getAttribute('data-nav-target') || el.getAttribute('href');
    if (!target || !NAV_PATTERN.test(target)) return;
    const swapSel = el.getAttribute('data-nav-swap');
    e.preventDefault();
    navigate(target, true, swapSel);
  });

  window.addEventListener('popstate', () => {
    const name = (window.location.pathname.split('/').pop() || 'index.html');
    navigate(name, false);
  });
})();
</script>

</body>
</html>
